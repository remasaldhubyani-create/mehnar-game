<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>العب مع مهنار | Play with Mehnar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Tajawal:wght@400;500;700&display=swap">
<script>
/* Theme and language are decided before first paint. This page is standalone: it has its own storage keys. */
(function () {
  var t = "", l = "";
  try { t = localStorage.getItem("mehnar-game-theme") || ""; l = localStorage.getItem("mehnar-game-lang") || ""; } catch (e) {}
  var dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  var en = l === "en";
  var root = document.documentElement;
  root.setAttribute("data-theme", dark ? "dark" : "light");
  root.setAttribute("lang", en ? "en" : "ar");
  root.setAttribute("dir", en ? "ltr" : "rtl");
})();
</script>
<style>
/* Mehnar identity: light = white + brand blues/purple, dark = navy + silver/white + light blue, purple buttons.
   One centered column. It scales up on wide screens so it reads well when projected. */
:root {
  --bg: #ffffff;
  --surface: #eef6ff;
  --surface-2: #ffffff;
  --ink: #0b1629;
  --muted: #565555;
  --line: #abd5ff;
  --accent: #701cf5;
  --accent-h: #5b12d0;
  --accent-t: #701cf5;
  --hl: #701cf5;
  --blue: #004aad;
  --sky: #519ef9;
  --link: #004aad;
  --ghost: #004aad;
  --ghost-line: rgba(81, 158, 249, .5);
  --g1: #519ef9;
  --g2: #701cf5;
  --ring-b: #701cf5;
  --glow-a: rgba(81, 158, 249, .35);
  --glow-b: rgba(112, 28, 245, .30);
  --deco: rgba(81, 158, 249, .12);
  --good: #14804a;
  --good-bg: #e3f6ea;
  --bad: #b20000;
  --bad-bg: #fdeaea;
  --logo-filter: none;
  --font-display: "Cairo", "Tajawal", Tahoma, sans-serif;
  --font-body: "Tajawal", Tahoma, "Segoe UI", sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0b1629;
  --surface: #0f2347;
  --surface-2: #0a1424;
  --ink: #ffffff;
  --muted: #a9b6cb;
  --line: #27406b;
  --accent: #701cf5;
  --accent-h: #8a4bf7;
  --accent-t: #8a4bf7;
  --hl: #d5dbe5;
  --blue: #519ef9;
  --sky: #abd5ff;
  --link: #519ef9;
  --ghost: #d5dbe5;
  --ghost-line: rgba(213, 219, 229, .5);
  --g1: #abd5ff;
  --g2: #ffffff;
  --ring-b: #ffffff;
  --glow-a: rgba(171, 213, 255, .30);
  --glow-b: rgba(255, 255, 255, .22);
  --deco: rgba(213, 219, 229, .07);
  --good: #5ee0a0;
  --good-bg: #123a2b;
  --bad: #ff8f8f;
  --bad-bg: #431b24;
  --logo-filter: brightness(0) invert(1);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.6;
  text-align: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    repeating-radial-gradient(circle at 0% 0%, transparent 0 110px, var(--deco) 110px 111px),
    repeating-radial-gradient(circle at 100% 100%, transparent 0 110px, var(--deco) 110px 111px);
}
.wrap { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; align-items: stretch; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.3; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
[hidden] { display: none !important; }

/* Top: controls, then the logo, all centered */
.top { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.ctrls { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.logo { height: 104px; width: auto; display: block; filter: var(--logo-filter); }
.pill-btn, .icon-btn {
  background: none; border: 1px solid var(--line); border-radius: 999px; color: var(--ink);
  min-height: 44px; font-weight: 700;
}
.pill-btn { padding: 8px 18px; }
.icon-btn { width: 44px; display: grid; place-items: center; padding: 0; }
.pill-btn:hover, .icon-btn:hover { border-color: var(--hl); color: var(--accent-t); }
.icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn .sun { display: none; }
:root[data-theme="dark"] .icon-btn .sun { display: block; }
:root[data-theme="dark"] .icon-btn .moon { display: none; }

/* Home */
.hero { display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 8px; }
.hero h1 { font-size: clamp(34px, 9vw, 52px); font-weight: 800; }
.hero p { color: var(--muted); max-width: 46ch; }
/* Bridge: same markup, sizes, colors and motion as the platform hero (HeroSection.jsx) */
.bridge { direction: ltr; display: flex; align-items: center; justify-content: center; gap: 0; width: 100%; max-width: 48rem; margin: 8px auto 0; animation: bridgeIn .7s ease .1s both; }
@keyframes bridgeIn { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: scale(1); } }
.bridge .node {
  flex-shrink: 0; width: 7rem; height: 7rem; border-radius: 9999px; border: 3px solid;
  background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 0 .5rem; text-align: center;
}
.bridge .node.seeker { border-color: #519ef9; box-shadow: 0 0 26px rgba(81, 158, 249, .35); }
.bridge .node.expert { border-color: #701cf5; box-shadow: 0 0 26px rgba(112, 28, 245, .35); }
.bridge .node b { color: #0b1629; font-weight: 700; font-size: .875rem; line-height: 1.25; }
.bridge .node small { color: #565555; font-size: 10px; line-height: 1.5; margin-top: .25rem; }
.bridge .link { position: relative; flex: 1 1 0%; height: 2px; background-image: linear-gradient(to right, #519ef9, #701cf5); }
.bridge .dot {
  position: absolute; top: 50%; width: .75rem; height: .75rem; border-radius: 9999px; background: #ffffff;
  border: 2px solid #701cf5; box-shadow: 0 0 12px rgba(255, 255, 255, .9); transform: translateY(-50%); left: 0;
}
.bridge .tag {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 9999px; background: #ffffff;
  border: 1px solid rgba(112, 28, 245, .6); color: #701cf5; font-size: 11px; line-height: 1.5; font-weight: 600; padding: .25rem .75rem;
}
:root[data-theme="dark"] .bridge .node { background: #0b1629; }
:root[data-theme="dark"] .bridge .node.seeker { border-color: #abd5ff; box-shadow: 0 0 26px rgba(171, 213, 255, .30); }
:root[data-theme="dark"] .bridge .node.expert { border-color: #ffffff; box-shadow: 0 0 26px rgba(255, 255, 255, .25); }
:root[data-theme="dark"] .bridge .node b { color: #ffffff; }
:root[data-theme="dark"] .bridge .node small { color: rgba(255, 255, 255, .5); }
:root[data-theme="dark"] .bridge .link { background-image: linear-gradient(to right, #abd5ff, #ffffff); }
:root[data-theme="dark"] .bridge .dot { border-color: #ffffff; }
:root[data-theme="dark"] .bridge .tag { background: #0b1629; border-color: rgba(138, 75, 247, .7); color: #ffffff; }
@media (min-width: 768px) {
  .bridge .node { width: 8rem; height: 8rem; }
  .bridge .node b { font-size: 1rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .bridge .dot { animation: travel 6s ease-in-out infinite; }
  @keyframes travel { 0% { left: 0%; } 50% { left: 100%; } 100% { left: 0%; } }
}

.cards { display: grid; gap: 14px; }
.card {
  width: 100%; text-align: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 22px 20px; display: flex; flex-direction: column; align-items: center; gap: 8px;
  transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--hl); }
.card:active { transform: scale(.99); }
.card h2 { font-size: 26px; font-weight: 800; }
.card .desc { color: var(--muted); }
.card .meta { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.chip { font-size: 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; color: var(--muted); }
.card .go { margin-top: 6px; color: var(--accent-t); font-weight: 700; }
.foot { color: var(--muted); font-size: 15px; }
.foot a { color: var(--link); }

/* Game */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px 20px; display: flex; flex-direction: column; align-items: stretch; gap: 14px; }
.panel h2 { font-size: 24px; font-weight: 800; }
.hint { color: var(--muted); font-size: 16px; }
.btn {
  background: var(--accent); color: #ffffff; border: 0; border-radius: 999px;
  padding: 12px 24px; min-height: 52px; font-weight: 700; font-size: 18px; transition: background .15s;
}
.btn:hover:not(:disabled) { background: var(--accent-h); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.ghost { background: none; color: var(--ghost); border: 1px solid var(--ghost-line); }
.btn.ghost:hover:not(:disabled) { background: none; border-color: var(--hl); color: var(--accent-t); }
a.btn { display: grid; place-items: center; text-decoration: none; margin-top: 6px; }

.timer { display: flex; align-items: center; gap: 12px; }
.bar { flex: 1; height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; }
.tm.low > i { background: var(--bad); }
.tnum { font-family: var(--font-display); font-weight: 800; font-size: 24px; min-width: 2ch; text-align: center; }

.pool { display: grid; gap: 10px; }
.step {
  text-align: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 16px; min-height: 52px; font-weight: 500;
}
.step:hover:not(:disabled) { border-color: var(--hl); }
.step:disabled { opacity: .35; cursor: default; }
.slots { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: s; }
.slot {
  counter-increment: s; display: flex; gap: 12px; align-items: center;
  border: 1.5px dashed var(--line); border-radius: 12px; padding: 10px 14px; min-height: 52px; background: var(--surface-2);
}
.slot::before, .slot::after { content: ""; flex: none; width: 30px; height: 30px; }
.slot::before {
  content: counter(s); border-radius: 50%;
  background: var(--surface); border: 1px solid var(--line); color: var(--muted);
  display: grid; place-items: center; font-weight: 700; font-size: 15px;
}
.slot.filled { border-style: solid; border-color: var(--blue); }
.slot.filled::before { background: var(--blue); color: #fff; border-color: var(--blue); }
.slot.ok { border-color: var(--good); background: var(--good-bg); }
.slot.ok::before { background: var(--good); color: #fff; border-color: var(--good); content: "\2713"; }
.slot.bad { border-color: var(--bad); background: var(--bad-bg); }
.slot.bad::before { background: var(--bad); color: #fff; border-color: var(--bad); content: "\2717"; }
.slot .t { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow-wrap: anywhere; text-align: center; }
.slot .fix { font-size: 15px; color: var(--ink); opacity: .85; }
.verdict { font-weight: 700; font-size: 20px; }
.cta { font-weight: 800; color: var(--accent-t); font-size: 18px; line-height: 1.4; text-align: center; }

.result { align-items: stretch; text-align: center; }
.bigstat { font-family: var(--font-display); font-weight: 800; font-size: 60px; color: var(--accent-t); line-height: 1.1; }

.how { list-style: none; margin: 14px auto 0; padding: 0; display: flex; justify-content: center; align-items: flex-start; gap: 14px; max-width: 40rem; }
.how li { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 15px; line-height: 1.35; font-weight: 600; }
.how i { font-style: normal; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; font-weight: 800; font-size: 15px; }
.startrow { display: flex; justify-content: center; margin-top: 8px; }
.startrow .btn { min-width: 220px; }
@media (max-width: 600px) {
  body { font-size: 17px; }
  main.wrap { gap: 12px; }
  body { padding-block: 12px 20px; }
  .top { gap: 8px; }
  .logo { height: 64px; }
  .pill-btn { padding: 4px 14px; min-height: 40px; }
  .icon-btn { width: 40px; min-height: 40px; }
  #home h1 { font-size: 26px; }
  .how { gap: 8px; margin-top: 20px; }
  .startrow { margin-top: 18px; }
  .how li { font-size: 13px; gap: 4px; }
  .how i { width: 26px; height: 26px; font-size: 13px; }
  .bridge .node { width: 5.6rem; height: 5.6rem; }
  .bridge .node b { font-size: .75rem; }
  .bridge .node small { font-size: 8px; }
  .bridge .tag { font-size: 10px; padding: .15rem .5rem; }
  /* game + result: compact so everything fits one screen */
  .panel { padding: 10px 12px; gap: 6px; border-radius: 14px; }
  .panel h2 { font-size: 19px; }
  .hint { font-size: 13px; line-height: 1.4; }
  .btn { min-height: 42px; padding: 8px 18px; font-size: 16px; }
  a.btn { margin-top: 0; }
  .tnum { font-size: 20px; }
  .bar { height: 8px; }
  .pool, .slots { gap: 5px; }
  .step { min-height: 38px; padding: 6px 12px; font-size: 15px; border-radius: 10px; }
  .slot { min-height: 38px; padding: 4px 10px; gap: 8px; border-radius: 10px; }
  .slot::before, .slot::after { width: 24px; height: 24px; }
  .slot::before { font-size: 13px; }
  .slot .t { font-size: 15px; gap: 0; }
  .slot .fix { font-size: 12px; line-height: 1.35; }
  .bigstat { font-size: 40px; }
  .verdict { font-size: 15px; line-height: 1.4; }
  .cta { font-size: 15px; }
  .result { gap: 6px; }
  .result .hint { font-size: 12px; }
}
@media (max-width: 600px) and (max-height: 780px) {
  body { padding-block: 6px 10px; }
  main.wrap { gap: 6px; }
  .top { gap: 4px; }
  .logo { height: 34px; }
  .pill-btn { min-height: 34px; padding: 2px 12px; font-size: 14px; }
  .icon-btn { width: 34px; min-height: 34px; }
  .panel { padding: 8px 10px; gap: 5px; }
  .panel h2 { font-size: 17px; }
  .hint { font-size: 12px; line-height: 1.3; }
  .step, .slot { min-height: 32px; }
  .step { padding: 3px 10px; font-size: 14px; }
  .slot { padding: 2px 8px; }
  .slot::before, .slot::after { width: 22px; height: 22px; }
  .slot .t { font-size: 14px; }
  .slot .fix { font-size: 11px; line-height: 1.25; }
  .pool, .slots { gap: 4px; }
  .btn { min-height: 38px; padding: 4px 16px; font-size: 15px; }
  .bigstat { font-size: 32px; }
  .verdict { font-size: 14px; }
  .cta { font-size: 14px; }
  .result { gap: 4px; }
  #home h1 { font-size: 24px; }
}

/* Phone: spread every screen over the full height, no scrolling */
@media (max-width: 600px) {
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding-block: 10px 62px; }
  main.wrap { flex: 1 1 auto; min-height: 0; gap: 8px; max-width: none; width: 100%; }
  #home, #skills { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  #home[hidden], #skills[hidden] { display: none !important; }
  #home { justify-content: space-evenly; }
  #home .how, #home .startrow { margin-top: 0; }
  .logo { height: clamp(44px, 9dvh, 96px); }
  #home h1 { font-size: clamp(26px, 4.6dvh, 38px); }
  .hero { gap: clamp(8px, 2dvh, 20px); }
  .startrow .btn { min-height: 52px; font-size: 19px; }
  #skills .panel { flex: 1 1 auto; }
  #skills .slots, #skills .pool { flex: 1 1 auto; grid-auto-rows: minmax(0, 1fr); align-content: stretch; }
  #skills .result .slots { grid-auto-rows: auto; align-content: space-between; }
  #skills .pool { flex-grow: 1; }
  .panel h2 { font-size: clamp(18px, 2.8dvh, 24px); }
  .step, .slot { font-size: clamp(14px, 2.1dvh, 17px); }
}

@media (max-width: 600px) {
  #skills .panel h2 { font-size: clamp(16px, 2.4dvh, 20px); }
  #skills .hint { font-size: 12px; }
  .step, .slot { min-height: 32px; }
  .step { padding-block: 3px; }
  .slot { padding-block: 2px; }
  .slot::before, .slot::after { width: 22px; height: 22px; }
  .panel { padding: 8px 10px; gap: 5px; }
  .btn { min-height: 38px; }
}

@media (min-width: 900px) {
  body { font-size: 22px; }
  .wrap { max-width: 860px; gap: 26px; }
  .logo { height: 132px; }
  .card h2 { font-size: 34px; }
  .panel h2 { font-size: 30px; }
  .hint { font-size: 20px; }
  .step, .slot { min-height: 60px; }
  .bigstat { font-size: 84px; }
  .tnum { font-size: 30px; }
}
</style>
</head>
<body>
<main class="wrap" id="app">
  <header class="top">
    <div class="ctrls">
      <button class="pill-btn" id="homeBtn" hidden type="button" data-i18n="home">الرئيسية</button>
      <button class="pill-btn" id="langBtn" type="button" aria-label="Language / اللغة">EN</button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Dark mode">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>

      cta: "ادخل مع مهنار عشان تستكشف كيف تبني مستقبلك", goMehnar: "ادخل مع مهنار ←", again: "العب مرة أخرى",
      langBtn: "EN", langLabel: "English", themeLabel: "الوضع الليلي"
    },
    en: {
      home: "Home", title: "Play with Mehnar",
      sub: "How do you get ready for the job market?", how1: "See 5 skills", how2: "Order them in 45 seconds", how3: "Get your result",
      seeker: "Knowledge Seeker", seekerSub: "Student \u00b7 Graduate \u00b7 Professional", expert: "Expert", expertSub: "Years of experience", brand: "Mehnar",
      cardTitle: "Put your career steps in order in 45 seconds",
      cardDesc: "Arrange the professional skills in the right order before time runs out.",
      chip1: "45 seconds", chip2: "Right or wrong", go: "Start the challenge →",
      foot: "Mehnar: where experience meets ambition",
      gameTitle: "The 5 most important skills to know and learn for the job market",
      gameHint: "Tap them in the <b>correct</b> order, from first to last.",
      yourOrder: "Your order", available: "Available skills", undo: "Undo",
      result: "Your result",
      okCount: function (ok, n) { return ok + " of " + n + " in the right place"; },
      timeUp: "Time is up. Skills you did not place count as wrong.",
      vPerfect: "Perfect order! You know the way",
      vGood: "You are on the right track",
      vLow: "No worries, Mehnar's experts will show you the way",
      place: "Correct place: ",
      cta: "Join Mehnar to discover how to build your future", goMehnar: "Join Mehnar →", again: "Play again",
      langBtn: "عربي", langLabel: "العربية", themeLabel: "Dark mode"
    }
  };

  /* The order of this array is the correct order. */
  var SKILLS = {
    ar: [
      { n: "السيرة الذاتية", w: "سيرتك هي بوابتك الأولى للفرص." },
      { n: "المهارات الناعمة", w: "التواصل والعمل بروح الفريق يدعمان سيرتك ويبنيان حضورك المهني." },
      { n: "إنشاء حساب رسمي للتقديم", w: "حسابك الرسمي هو الباب اللي تقدّم منه على الوظائف." },
      { n: "التقديم على الوظائف بشكل مناسب", w: "قدّم على الوظيفة اللي تناسبك بسيرة موجّهة لها." },
      { n: "اجتياز المقابلة الشخصية", w: "آخر محطة: المقابلة اللي تحوّل الفرصة لوظيفة." }
    ],
    en: [
      { n: "The CV", w: "Your CV is your first door to opportunities." },
      { n: "Soft skills", w: "Communication and teamwork support your CV and build your professional presence." },
      { n: "Creating an official account to apply", w: "Your official account is the door you apply through." },
      { n: "Applying to jobs the right way", w: "Apply to the job that fits you, with a CV tailored to it." },
      { n: "Passing the job interview", w: "The last stop: the interview that turns an opportunity into a job." }
    ]
  };

  /* ---------- helpers ---------- */
  var $ = function (id) { return document.getElementById(id); };
  var root = document.documentElement;
  var lang = root.getAttribute("lang") === "en" ? "en" : "ar";
  function t(k) { return TXT[lang][k]; }
  function shuffle(a) {
    var b = a.slice();
    for (var i = b.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var x = b[i]; b[i] = b[j]; b[j] = x;
    }
    return b;
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function applyLang() {
    root.setAttribute("lang", lang);
    root.setAttribute("dir", lang === "en" ? "ltr" : "rtl");
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    $("langBtn").textContent = t("langBtn");
    $("langBtn").setAttribute("aria-label", t("langLabel"));
    $("themeBtn").setAttribute("aria-label", t("themeLabel"));
    $("bridge").setAttribute("aria-label", lang === "en" ? "A bridge between the knowledge seeker and the expert" : "جسر بين الباحث عن المعرفة والخبير");
  }

  /* ---------- routing ---------- */
  var views = ["home", "skills"];
  var cleanup = null;
  function stopAll() { if (cleanup) { try { cleanup(); } catch (e) {} cleanup = null; } }
  function show(name) {
    views.forEach(function (v) { $(v).hidden = v !== name; });
    $("homeBtn").hidden = name === "home";
    window.scrollTo(0, 0);
  }
  function route() {
    var h = (location.hash || "").replace("#", "");
    stopAll();
    if (h === "skills") { startSkills(); show("skills"); }
    else { show("home"); }
  }
  function go(name) {
    if (location.hash === "#" + name) route(); else location.hash = name;
  }
  window.addEventListener("hashchange", route);
  $("homeBtn").addEventListener("click", function () { go("home"); });
  $("startCard").addEventListener("click", function () { go("skills"); });

  $("themeBtn").addEventListener("click", function () {
    var dark = root.getAttribute("data-theme") !== "dark";
    root.setAttribute("data-theme", dark ? "dark" : "light");
    try { localStorage.setItem("mehnar-game-theme", dark ? "dark" : "light"); } catch (e) {}
  });
  $("langBtn").addEventListener("click", function () {
    lang = lang === "ar" ? "en" : "ar";
    try { localStorage.setItem("mehnar-game-lang", lang); } catch (e) {}
    applyLang();
    route(); // a running game restarts in the new language
  });

  /* =====================================================
     The game: put the career steps in order, 45 seconds.
     ===================================================== */
  function startSkills() {
    stopAll();
    var list = SKILLS[lang];
    var n = list.length, secs = Math.round(TIME_MS / 1000);
    var sk = { placed: [], pool: shuffle(list.map(function (_, i) { return i; })), t0: Date.now(), iv: 0, over: false, timedOut: false, given: 0 };
    cleanup = function () { clearInterval(sk.iv); sk.over = true; };
    draw();
    sk.iv = setInterval(tick, 100);

    function tick() {
      if (sk.over) return;
      var left = TIME_MS - (Date.now() - sk.t0);
      var tb = $("tb"), tl = $("tl");
      if (tb) { tb.style.width = Math.max(0, left / TIME_MS * 100) + "%"; tb.parentNode.classList.toggle("low", left < 10000); }
      if (tl) tl.textContent = Math.max(0, Math.ceil(left / 1000));
      if (left <= 0) finish(true);
    }
    function draw() {
      var html = '<div class="panel"><div class="timer"><div class="bar tm"><i id="tb" style="width:100%"></i></div><span class="tnum" id="tl" dir="ltr">' + secs + '</span></div>' +
        '<h2>' + t("gameTitle") + '</h2>' +
        '<p class="hint">' + t("gameHint") + '</p>' +
        '<ol class="slots" aria-label="' + t("yourOrder") + '">';
      for (var i = 0; i < n; i++) {
        var v = sk.placed[i];
        html += v === undefined ? '<li class="slot"></li>' :
          '<li class="slot filled"><span class="t"><span>' + esc(list[v].n) + '</span></span></li>';
      }
      html += '</ol><div class="pool" aria-label="' + t("available") + '">';
      sk.pool.forEach(function (v) {
        var used = sk.placed.indexOf(v) !== -1;
        html += '<button type="button" class="step" data-v="' + v + '"' + (used ? ' disabled' : '') + '>' + esc(list[v].n) + '</button>';
      });
      html += '</div><button type="button" class="btn ghost" id="sUndo"' + (sk.placed.length && sk.placed.length < n ? '' : ' disabled') + '>' + t("undo") + '</button></div>';
      $("skills").innerHTML = html;
      document.querySelectorAll("#skills .step").forEach(function (b) {
        b.addEventListener("click", function () {
          if (sk.over) return;
          sk.placed.push(Number(b.getAttribute("data-v")));
          if (sk.placed.length === n) { tick(); draw(); setTimeout(function () { finish(false); }, 350); }
          else { draw(); tick(); }
        });
      });
      $("sUndo").addEventListener("click", function () {
        if (!sk.over && sk.placed.length < n) { sk.placed.pop(); draw(); tick(); }
      });
    }
    function finish(timeout) {
      if (sk.over) return; sk.over = true; clearInterval(sk.iv);
      sk.given = sk.placed.length;
      if (sk.given < n) {
        sk.timedOut = timeout;
        sk.pool.forEach(function (v) { if (sk.placed.indexOf(v) === -1) sk.placed.push(v); });
      }
      showResult();
    }
    function showResult() {
      var ok = 0;
      sk.placed.forEach(function (v, i) { if (i < sk.given && v === i) ok++; });
      var pct = Math.round(ok / n * 100);
      var verdict = pct === 100 ? t("vPerfect") : pct >= 60 ? t("vGood") : t("vLow");
      var html = '<div class="panel result"><h2>' + t("result") + '</h2><div class="bigstat" dir="ltr">' + pct + '%</div>' +
        '<p class="hint">' + t("okCount")(ok, n) + '</p>' +
        (sk.timedOut ? '<p class="hint">' + t("timeUp") + '</p>' : '') +
        '<p class="verdict">' + verdict + '</p><ol class="slots">';
      sk.placed.forEach(function (v, i) {
        var good = i < sk.given && v === i;
        html += '<li class="slot ' + (good ? 'ok' : 'bad') + '"><span class="t"><span>' + esc(list[v].n) + '</span>' +
          (good ? '' : '<span class="fix">' + t("place") + (v + 1) + ' · ' + esc(list[v].w) + '</span>') + '</span></li>';
      });
      html += '</ol><p class="cta">' + t("cta") + '</p><a class="btn" href="' + EXPERTS_URL + '" target="_blank" rel="noopener">' + t("goMehnar") + '</a>' +
        '<button type="button" class="btn ghost" id="sAgain">' + t("again") + '</button></div>';
      $("skills").innerHTML = html;
      $("sAgain").addEventListener("click", function () { startSkills(); window.scrollTo(0, 0); });
      window.scrollTo(0, 0);
    }
  }

  applyLang();
  route();
})();
</script>

</body>
</html>
